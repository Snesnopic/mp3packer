# file: .github/workflows/ci.yml

name: OCaml CI Build

# triggers on push or PR to the main branch
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    # job name
    name: Build on ${{ matrix.os }} (OCaml ${{ matrix.ocaml-version }})

    # run on all three requested OSes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # use a recent, stable ocaml version
        ocaml-version: ['4.14.2']

    runs-on: ${{ matrix.os }}

    steps:
    - name: Check out code
      # get the source code
      uses: actions/checkout@v4

    - name: Set up OCaml
      # use the official action to set up opam and ocaml
      uses: ocaml/setup-ocaml@v2
      with:
        ocaml-compiler: ${{ matrix.ocaml-version }}
        # enable dune build caching for speed
        dune-cache: true

    - name: Install OCaml dependencies
      # install dependencies defined in opam files
      # if you don't have .opam files, this just installs dune
      run: opam install . --deps-only --with-test

    - name: Build project
      # compile the project using dune
      run: dune build

    - name: Upload executable artifact
      # upload the resulting executable
      # dune standardizes on the .exe extension, even on unix
      uses: actions/upload-artifact@v4
      with:
        # artifact name will be e.g., "mp3packer-ubuntu-latest"
        name: mp3packer-${{ matrix.os }}
        path: _build/default/mp3packer.exe