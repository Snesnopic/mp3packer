# file: .github/workflows/build.yml

name: OCaml CI Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    name: Build on ${{ matrix.os }} (OCaml ${{ matrix.ocaml-version }})

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
        ocaml-version: ['4.14.2']

    runs-on: ${{ matrix.os }}

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up OCaml
      uses: ocaml/setup-ocaml@v3.4.5
      with:
        ocaml-compiler: ${{ matrix.ocaml-version }}
        dune-cache: true
      
    - name: Install dependencies and Build
      run: |
        opam install dune dune-configurator
        opam exec -- dune build
        
    - name: Upload executable artifact
      uses: actions/upload-artifact@v4
      with:
        name: mp3packer-${{ matrix.os }}
        path: _build/default/mp3packer.exe
